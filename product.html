<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Market - Product</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <div class="logo">3DMarket</div>
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="marketplace.html">Marketplace</a>
            <a href="upload.html">Upload</a>
            <a href="profile.html">Profile</a>
            <a href="admin.html">Admin</a>
        </nav>
        <div class="auth-buttons">
            <a href="#" id="login-btn">Login</a>
            <a href="#" id="register-btn">Register</a>
        </div>
    </header>

    <main>
        <div class="product-page">
            <div class="product-gallery">
                <div class="preview-viewer">
                    3D Preview (STL/OBJ/FBX)
                </div>
                <!-- Thumbnails for other images -->
                <div class="thumbnails" style="display: flex; gap: 1rem; margin-top: 1rem;">
                    <img src="https://via.placeholder.com/100x100" alt="Thumbnail 1" style="border: 2px solid #00aaff; border-radius: 5px;">
                    <img src="https://via.placeholder.com/100x100" alt="Thumbnail 2" style="border-radius: 5px;">
                    <img src="https://via.placeholder.com/100x100" alt="Thumbnail 3" style="border-radius: 5px;">
                </div>
            </div>
            <div class="product-details">
                <h1></h1>
                <div class="price"></div>
                <div class="description">
                    <p></p>
                </div>
                <div class="product-actions">
                    <a href="#" class="btn buy-now">Buy Now</a>
                    <a href="#" class="btn add-to-cart">Add to Cart</a>
                </div>
                <div class="seller-preview">
                    <h3>Sold by</h3>
                    <p></p>
                    <a href="profile.html">View Profile</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Login</h2>
            <form id="login-form" class="upload-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="submit-btn">Login</button>
            </form>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="register-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Register</h2>
            <form id="register-form" class="upload-form">
                <div class="form-group">
                    <label for="register-username">Username</label>
                    <input type="text" id="register-username" required>
                </div>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" required>
                </div>
                <button type="submit" class="submit-btn">Register</button>
            </form>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2024 3DMarket. All rights reserved.</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
