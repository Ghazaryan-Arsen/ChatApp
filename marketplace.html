<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Market - Marketplace</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <div class="logo">3DMarket</div>
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="marketplace.html">Marketplace</a>
            <a href="upload.html">Upload</a>
            <a href="profile.html">Profile</a>
            <a href="admin.html">Admin</a>
        </nav>
        <div class="auth-buttons">
            <a href="#" id="login-btn">Login</a>
            <a href="#" id="register-btn">Register</a>
        </div>
    </header>

    <main>
        <section class="marketplace-header">
            <h1>Marketplace</h1>
            <input type="text" class="search-bar" placeholder="Search for models...">
            <div class="filters">
                <select>
                    <option>Category</option>
                    <option>Characters</option>
                    <option>Architecture</option>
                    <option>Vehicles</option>
                </select>
                <select>
                    <option>Price</option>
                    <option>Free</option>
                    <option>Under $10</option>
                    <option>$10 - $50</option>
                </select>
                <select>
                    <option>Popularity</option>
                    <option>Most Liked</option>
                    <option>Most Viewed</option>
                </select>
            </div>
        </section>

        <section class="models-section">
            <div class="models-grid">
                <!-- Models will be dynamically inserted here by js/main.js -->
            </div>
        </section>

        <div class="pagination">
            <a href="#" class="active">1</a>
            <a href="#">2</a>
            <a href="#">3</a>
            <a href="#">...</a>
            <a href="#">10</a>
        </div>
    </main>

    <!-- Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Login</h2>
            <form id="login-form" class="upload-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="submit-btn">Login</button>
            </form>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="register-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Register</h2>
            <form id="register-form" class="upload-form">
                <div class="form-group">
                    <label for="register-username">Username</label>
                    <input type="text" id="register-username" required>
                </div>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" required>
                </div>
                <button type="submit" class="submit-btn">Register</button>
            </form>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2024 3DMarket. All rights reserved.</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
