<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Market - Profile</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <div class="logo">3DMarket</div>
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="marketplace.html">Marketplace</a>
            <a href="upload.html">Upload</a>
            <a href="profile.html">Profile</a>
            <a href="admin.html">Admin</a>
        </nav>
        <div class="auth-buttons">
            <a href="#">Login</a>
            <a href="#">Register</a>
        </div>
    </header>

    <main>
        <div class="profile-page">
            <div class="profile-header">
                <img src="https://via.placeholder.com/150" alt="User Avatar" class="profile-avatar">
                <div class="profile-info">
                    <h1>Artist1</h1>
                    <p>3D Artist from Planet Earth</p>
                </div>
            </div>

            <div class="profile-stats">
                <div class="stat">
                    <h3>Total Sales</h3>
                    <p>123</p>
                </div>
                <div class="stat">
                    <h3>Total Earnings</h3>
                    <p>$5,432.10</p>
                </div>
                <div class="stat">
                    <h3>Uploaded Models</h3>
                    <p>8</p>
                </div>
                <button class="withdraw-btn" style="margin-left: auto; align-self: center;">Withdraw</button>
            </div>

            <section class="models-section">
                <h2>My Uploaded Models</h2>
                <div class="models-grid">
                    <!-- Mock data for uploaded models -->
                    <div class="model-card">
                        <img src="https://via.placeholder.com/300x200" alt="Model 1">
                        <h3>Sci-Fi Helmet</h3>
                        <p>$49.99</p>
                    </div>
                    <div class="model-card">
                        <img src="https://via.placeholder.com/300x200" alt="Model 5">
                        <h3>Ancient Ruins</h3>
                        <p>$29.99</p>
                    </div>
                    <div class="model-card">
                        <img src="https://via.placeholder.com/300x200" alt="Model 8">
                        <h3>Robot Arm</h3>
                        <p>$19.99</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2024 3DMarket. All rights reserved.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
