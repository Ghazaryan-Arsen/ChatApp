<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Market - Profile</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <div class="logo">3DMarket</div>
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="marketplace.html">Marketplace</a>
            <a href="upload.html">Upload</a>
            <a href="profile.html">Profile</a>
            <a href="admin.html">Admin</a>
        </nav>
        <div class="auth-buttons">
            <a href="#" id="login-btn">Login</a>
            <a href="#" id="register-btn">Register</a>
        </div>
    </header>

    <main>
        <div class="profile-page">
            <div class="profile-header">
                <img src="https://via.placeholder.com/150" alt="User Avatar" class="profile-avatar">
                <div class="profile-info">
                    <h1></h1>
                    <p></p>
                </div>
            </div>

            <div class="profile-stats">
                <div class="stat">
                    <h3>Total Sales</h3>
                    <p></p>
                </div>
                <div class="stat">
                    <h3>Total Earnings</h3>
                    <p></p>
                </div>
                <div class="stat">
                    <h3>Uploaded Models</h3>
                    <p></p>
                </div>
                <button class="withdraw-btn" style="margin-left: auto; align-self: center;">Withdraw</button>
            </div>

            <section class="models-section">
                <h2>My Uploaded Models</h2>
                <div class="models-grid">
                    <!-- User's models will be dynamically inserted here -->
                </div>
            </section>
        </div>
    </main>

    <!-- Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Login</h2>
            <form id="login-form" class="upload-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="submit-btn">Login</button>
            </form>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="register-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Register</h2>
            <form id="register-form" class="upload-form">
                <div class="form-group">
                    <label for="register-username">Username</label>
                    <input type="text" id="register-username" required>
                </div>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" required>
                </div>
                <button type="submit" class="submit-btn">Register</button>
            </form>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2024 3DMarket. All rights reserved.</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
